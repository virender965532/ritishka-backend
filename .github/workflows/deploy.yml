name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print GitHub Actions context (for debugging)
        run: |
          echo "Triggered by branch: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit SHA: $GITHUB_SHA"

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.201.114.61
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "✅ Connected to EC2 successfully"
            uname -a
            whoami
            pwd

      - name: Deploy to EC2 with logs
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.201.114.61
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -x  # Enable debug mode (shows each command before running)
            echo "📂 Changing to backend directory..."
            cd ~/ritishka-backend || exit 1

            echo "📥 Pulling latest code from develop branch..."
            git pull origin develop

            echo "📦 Installing dependencies..."
            npm install

            echo "🚀 Restarting PM2 processes..."
            pm2 restart all

            echo "✅ Deployment complete!"
